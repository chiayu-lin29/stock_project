<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub Elite - Pro Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap');
        
        :root {
            --bg-deep: #0f172a; 
            --bg-panel: #1e293b;
            --neon-green: #22c55e;
            --neon-cyan: #06b6d4;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 0% 0%, #1e293b 0%, #0f172a 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            background-attachment: fixed;
            color: #f1f5f9;
            margin: 0;
            overflow-x: hidden;
        }

        .stock-curve-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.12;
        }

        .curve-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 8s ease-in-out forwards infinite alternate, 
                       floating 20s linear infinite;
        }

        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }

        @keyframes floating {
            0% { transform: translateX(-5%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(-5%); }
        }

        .glass-jelly {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .jelly-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .jelly-card:hover {
            background: rgba(30, 41, 59, 0.6);
            transform: translateY(-2px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 10px 40px -10px rgba(34, 197, 94, 0.15);
        }

        .text-gradient-neon {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .gradient-elite {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="stock-curve-overlay">
        <svg width="120%" height="100%" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="position: absolute; left: -10%;">
            <path class="curve-path" d="M0 450C150 450 200 150 350 150C500 150 550 400 700 400C850 400 900 200 1050 200C1200 200 1250 350 1400 350" stroke="url(#paint0_linear)" stroke-width="2" />
            <path class="curve-path" d="M0 500C100 500 250 300 400 300C550 300 600 480 750 480C900 480 1000 250 1150 250C1300 250 1350 400 1500 400" stroke="url(#paint1_linear)" stroke-width="1" opacity="0.5" />
            <defs>
                <linearGradient id="paint0_linear" x1="0" y1="300" x2="1400" y2="300" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#22c55e" />
                    <stop offset="1" stop-color="#06b6d4" />
                </linearGradient>
                <linearGradient id="paint1_linear" x1="0" y1="300" x2="1500" y2="300" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#06b6d4" />
                    <stop offset="1" stop-color="#22c55e" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
