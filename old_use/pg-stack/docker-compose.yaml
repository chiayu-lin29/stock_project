#db.env is for server use
#.env is for client use -> for connection

version: "3.8"

services:
  # -------------------------------
  # PostgreSQL Service
  # -------------------------------
  db:
    image: postgres:16
    container_name: pg16
    env_file:
      - ./db.env
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # 主機 5433 對應容器 5432，避免和本機衝突
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------
  # pgAdmin Service
  # -------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin-stock
    env_file:
      - ./db.env
    # environment:
    #   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    #   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"  # 改成 5050，避免和 8888 衝突
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # ★ 關鍵：保存所有 Server 設定

# -------------------------------
# Persistent Volumes
# -------------------------------
volumes:
  pgdata:
  pgadmin_data:
